name: ci

on:
  push:
    branches: [main]
  pull_request:
  # THE CANARY HAS TO SING WHEN NOBODY IS IN THE ROOM.
  #
  # The `conformance` job below argues, correctly, that "a conformance
  # instrument that only notices drift when someone looks is not an
  # instrument". It then only ran on push and pull_request - which is
  # precisely "when someone looks". Between 2026-08-05 and 2026-08-10 nobody
  # pushed here, twelve contracts landed in the engine, and this repo reported
  # nothing: last run green, pin at 31, engine at 43.
  #
  # The reasoning was right and the wiring defeated it. A daily schedule is
  # what makes the sentence true.
  schedule:
    - cron: "17 6 * * *"
  # And a manual trigger, so drift can be checked on purpose after an engine
  # merge without waiting for the next morning.
  workflow_dispatch:

jobs:
  narrator:
    # The grounding test is the one that matters: it fails if any number in a
    # generated sentence cannot be found in the rows that sentence cites. A
    # green run here is the evidence for the claim RULES.md makes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: narrator tests (grounding, citations, realisation)
        run: node tools/test_narrator.js
      - name: ask tests (grounding, refusal, no SQL from user text)
        run: node tools/test_ask.js
      - name: contract 51's absence pair renders as itself
        run: node tools/test_absence.js
      - name: the brief renders
        run: node tools/narrate.js

  conformance:
    # THE CLAIM IN RULES.md, CHECKED AGAINST THE ENGINE AS IT IS TODAY.
    #
    # This repo calls itself vitai's conformance client - "a barebones reader
    # that proves the engine's read model is consumable by someone who is not
    # the flagship app". Every other job here runs against the COMMITTED
    # `demo/health.db`, which is a snapshot, so all of them stayed green while
    # this client sat a contract behind the engine. Twice in one day, both
    # times found by a person rebuilding the demo by hand.
    #
    # A conformance instrument that only notices drift when someone looks is
    # not an instrument. So this job checks the engine out at its DEFAULT
    # BRANCH, unpinned and deliberately, rebuilds the demo through the real
    # engine, and fails if this client's pin no longer matches what the engine
    # emits.
    #
    # IT IS SUPPOSED TO GO RED WHEN THE ENGINE MOVES. That is the signal, not
    # a fault: this repo's job is to be the thing that notices. loadline pins
    # its engine and follows deliberately, because a product needs to choose
    # when to absorb a change; this one does not get that freedom, and should
    # not want it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lens
      - uses: actions/checkout@v4
        with:
          repository: Wombat164/vitai
          path: vitai
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install the engine at its current head
        run: pip install -e ./vitai
      - name: the engine's own demo builds through this client's builder
        working-directory: lens
        run: python tools/make_demo.py --vitai ../vitai
      - name: this client is pinned to the contract the engine emits
        working-directory: lens
        run: |
          python3 - <<'PY'
          import pathlib, re, sqlite3, sys
          con = sqlite3.connect("demo/health.db")
          built = str(con.execute(
              "SELECT value FROM meta WHERE key = 'contract'").fetchone()[0])
          bad = []
          for f in ("index.html", "tools/narrate.js"):
              s = pathlib.Path(f).read_text(encoding="utf-8")
              m = re.search(r'BUILT_AGAINST_CONTRACT = "(\d+)"', s)
              if not m:
                  bad.append(f"{f}: no BUILT_AGAINST_CONTRACT found")
              elif m.group(1) != built:
                  bad.append(f"{f}: pinned to {m.group(1)}, engine emits {built}")
          if bad:
              print("\n".join(bad))
              print("\nThe engine moved. Read its migration note for contract "
                    f"{built}, decide what it asks of this client, then raise "
                    "the pin. Raising it without reading is how a client "
                    "renders a shape it does not understand.")
              sys.exit(1)
          print(f"pinned to contract {built}, which is what the engine emits")
          PY
      - name: the suites pass against the freshly built demo
        working-directory: lens
        run: |
          node tools/test_ask.js
          node tools/test_narrator.js
          node tools/test_absence.js
          node tools/narrate.js

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: narrator parses
        run: node --check narrator.js
      - name: ask parses
        run: node --check ask.js
      - name: the page script parses
        # The page is a single HTML file, so its script is not otherwise
        # checked by anything until a browser refuses to run it.
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess, tempfile, sys, os
          s = pathlib.Path("index.html").read_text(encoding="utf-8")
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', s, re.S)
          if not blocks:
              sys.exit("no inline script found in index.html")
          f = tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8")
          f.write(blocks[-1]); f.close()
          r = subprocess.run(["node", "--check", f.name], capture_output=True, text=True)
          os.unlink(f.name)
          if r.returncode:
              sys.exit(r.stderr)
          print("page script parses")
          PY

  offline:
    # The page must render with no network beyond the server it loaded from.
    # This is the regression guard for the vendored parser: it fails with the
    # URL the page wanted, so a slide back to a CDN cannot pass unnoticed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python tools/test_offline.py

  ascii:
    # House style: ASCII only, and never the double-hyphen separator.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import pathlib, sys
          bad = []
          for p in list(pathlib.Path(".").rglob("*.md")) + \
                   list(pathlib.Path(".").rglob("*.js")) + \
                   [pathlib.Path("index.html")]:
              # vendor/ is third-party code. House style is a rule about what
              # we write, and reformatting someone else's library to satisfy it
              # would turn the next upgrade into a merge conflict. It happens to
              # pass today, which is not a reason to leave it in scope.
              if ".git" in p.parts or "vendor" in p.parts:
                  continue
              t = p.read_text(encoding="utf-8")
              for i, line in enumerate(t.splitlines(), 1):
                  if any(ord(c) > 127 for c in line):
                      bad.append(f"{p}:{i}: non-ASCII")
                  if " -- " in line:
                      bad.append(f"{p}:{i}: double-hyphen separator")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("ascii clean")
          PY

  alarm:
    # SOMETHING HAS TO READ THE CANARY.
    #
    # The schedule above fixed half of this: the job now sings when nobody is
    # in the room. On 2026-08-18 it sang at 07:03, went red because this client
    # was counting stated absences as weigh-ins, and NOTHING RECORDED IT. Issue
    # #17 had already named the shape - "the alarm rings into nothing. A signal
    # nobody reads is not a signal" - and it was still true, because the fix
    # for it had been to run the check more often rather than to route its
    # result anywhere.
    #
    # So a red conformance run files an issue. This repo's whole justification
    # for loadline's pinned freedom is that drift is noticed HERE, and an issue
    # is the only artefact in this estate that survives nobody looking.
    #
    # NOT ON PULL REQUESTS. There the author is already looking at the red
    # check, and an issue per pushed branch is noise that would train everyone
    # to ignore the label.
    #
    # ONE ISSUE, REOPENED RATHER THAN MULTIPLIED. A new issue per failing day
    # would bury the first one, which is the one carrying the diagnosis. It
    # comments on the existing issue only for SCHEDULED runs, which bounds it
    # at one comment a day and makes the comment thread a record of how long
    # the canary has been red.
    needs: [conformance]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: file or update the drift alarm
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          TITLE="Canary red: the engine moved and this client has not followed"
          BODY="The conformance job failed on a \`$EVENT\` run.

          That job checks this client out against the engine's DEFAULT BRANCH,
          unpinned, rebuilds the demo through the real engine and runs the
          suites against it. Red here means one of two things, and the run log
          says which:

          - the pin no longer matches the contract the engine emits, so read
            the engine's migration note before raising it; or
          - the pin matches and a suite failed, which means the engine changed
            something this client renders and the rendering is now wrong.

          The second kind is the one that passes every other job. Do not close
          this by rebuilding the committed demo.

          Run: $RUN_URL"
          EXISTING=$(gh issue list --state open --limit 100 \
            --json number,title --jq \
            ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY"
          elif [ "$EVENT" = "schedule" ]; then
            gh issue comment "$EXISTING" --body "Still red. $BODY"
          else
            echo "alarm #$EXISTING is already open; not commenting on a $EVENT run"
          fi
